<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ollama Local Interface</title>
    <style>
        :root {
            --bg-color: #212121;
            --header-bg: #171717;
            --panel-bg: #2f2f2f;
            --text-main: #ececec;
            --text-muted: #9e9e9e;
            --accent: #10a37f;
            --user-bubble: #2f2f2f;
            --bot-bubble: transparent;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; }

        /* Header / Controls */
        header { background-color: var(--header-bg); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .logo { font-size: 18px; font-weight: bold; display: flex; align-items: center; gap: 10px; }
        
        .controls { display: flex; align-items: center; gap: 12px; }
        #status-indicator { padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; background: #444; }
        .status-online { background: #1b4d3e !important; color: #4ade80; }
        .status-offline { background: #5c1a1a !important; color: #f87171; }
        
        select, button { background: var(--panel-bg); color: var(--text-main); border: 1px solid #444; padding: 8px 12px; border-radius: 6px; cursor: pointer; outline: none; }
        button:hover, select:hover { background: #3a3a3a; }
        
        /* Chat Area */
        main { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .chat-container { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 20px; padding-bottom: 40px; }
        
        .message { display: flex; gap: 15px; padding: 15px; border-radius: 8px; line-height: 1.6; max-width: 100%; }
        .message.user { background-color: var(--user-bubble); align-self: flex-end; max-width: 85%; }
        .message.assistant { background-color: var(--bot-bubble); align-self: flex-start; width: 100%; }
        
        .avatar { font-size: 20px; }
        .content { flex: 1; word-wrap: break-word; overflow-x: auto; max-width: 100%; }
        
        /* Input Area */
        footer { padding: 20px; display: flex; justify-content: center; background: linear-gradient(180deg, transparent, var(--bg-color) 20%); }
        .input-wrapper { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 10px; }
        #attachment-chip { display: none; background: var(--panel-bg); padding: 5px 12px; border-radius: 15px; font-size: 12px; align-self: flex-start; border: 1px solid #444; }
        
        .input-box { display: flex; background: var(--panel-bg); border-radius: 12px; border: 1px solid #444; padding: 8px; align-items: flex-end; }
        #attach-btn { background: transparent; border: none; font-size: 20px; padding: 10px; border-radius: 8px; }
        #attach-btn:hover { background: #444; }
        
        textarea { flex: 1; background: transparent; border: none; color: white; padding: 12px; font-size: 16px; font-family: inherit; resize: none; max-height: 200px; outline: none; field-sizing: content; min-height: 44px;}
        
        #send-btn { background: var(--text-main); color: var(--bg-color); font-weight: bold; border: none; padding: 10px 16px; border-radius: 8px; height: 44px; }
        #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* === Markdown Typography === */
        .content h1, .content h2, .content h3, .content h4, .content h5, .content h6 { margin: 18px 0 10px 0; color: #fff; font-weight: 700; }
        .content h1 { font-size: 1.6em; border-bottom: 1px solid #444; padding-bottom: 5px; }
        .content h2 { font-size: 1.4em; }
        .content h3 { font-size: 1.25em; }
        .content h4 { font-size: 1.1em; }
        .content h5 { font-size: 1.0em; }
        .content h6 { font-size: 0.9em; color: #ccc; }
        .content hr { border: 0; border-top: 1px solid #444; margin: 20px 0; }
        .content strong { color: #fff; font-weight: 600; }
        
        /* Lists */
        .list-item { display: flex; margin-bottom: 5px; margin-left: 5px; }
        .list-bullet { margin-right: 10px; font-weight: bold; color: var(--text-muted); min-width: 15px; text-align: right; }
        
        .inline-code { background: #444; padding: 2px 6px; border-radius: 4px; font-family: 'Courier New', Courier, monospace; font-size: 0.9em; color: #ff9e64; }
        
        /* Code Blocks */
        .code-block { background: #1e1e1e; border-radius: 8px; margin: 15px 0; border: 1px solid #333; overflow: hidden; }
        .code-header { background: #2d2d2d; padding: 8px 15px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-family: monospace; color: #aaa; border-bottom: 1px solid #333; }
        .copy-btn { background: #444; color: #fff; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; transition: 0.2s; }
        .copy-btn:hover { background: #555; }
        .code-block pre { padding: 15px; overflow-x: auto; margin: 0; }
        .code-block code { font-family: 'Courier New', Courier, monospace; font-size: 14px; color: #dcdcaa; }

        /* Tables */
        .table-wrapper { overflow-x: auto; margin: 15px 0; border-radius: 8px; border: 1px solid #444; }
        table { width: 100%; border-collapse: collapse; background: #1e1e1e; text-align: left; font-size: 14px; }
        thead { background: #2d2d2d; font-weight: bold; border-bottom: 2px solid #444; }
        th, td { padding: 10px 15px; border-bottom: 1px solid #333; border-right: 1px solid #333; }
        th:last-child, td:last-child { border-right: none; }
        tr:last-child td { border-bottom: none; }

        /* Math */
        .math-inline { font-family: 'Cambria Math', 'Times New Roman', serif; color: #64b5f6; font-size: 1.1em; background: #2a2a2a; padding: 1px 4px; border-radius: 4px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">🦙 Ollama Local WebUI</div>
        <div class="controls">
            <span id="status-indicator" class="status-offline">🔴 Offline (Run 'ollama serve')</span>
            <button id="refresh-btn" onclick="checkStatus()">🔄 Refresh</button>
            <select id="model-select">
                <option value="">Select a Model...</option>
            </select>
        </div>
    </header>

    <main>
        <div class="chat-container" id="chat-box">
            <div class="message assistant">
                <div class="avatar">🤖</div>
                <div class="content">Hello! Ensure Ollama is running, select a local model from the top right, and say hi!</div>
            </div>
        </div>
    </main>

    <footer>
        <div class="input-wrapper">
            <div id="attachment-chip">📎 <span id="file-name">file.txt</span> <button onclick="clearFile()" style="background:none;border:none;color:white;margin-left:5px;">✖</button></div>
            <div class="input-box">
                <input type="file" id="file-input" accept=".txt,.md,.csv,.js,.py,.java,.html,.css,.json" hidden>
                <button id="attach-btn" onclick="document.getElementById('file-input').click()" title="Attach Text File">📎</button>
                <textarea id="prompt-input" placeholder="Type a message... (Shift+Enter for new line)" rows="1"></textarea>
                <button id="send-btn" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </footer>

    <script>
        const OLLAMA_URL = "http://127.0.0.1:11434";
        let chatHistory = [];
        let attachedFileContent = "";
        let abortController = null;

        // UI Elements
        const statusInd = document.getElementById('status-indicator');
        const modelSelect = document.getElementById('model-select');
        const chatBox = document.getElementById('chat-box');
        const promptInput = document.getElementById('prompt-input');
        const sendBtn = document.getElementById('send-btn');
        const fileInput = document.getElementById('file-input');
        const attachmentChip = document.getElementById('attachment-chip');
        const fileNameSpan = document.getElementById('file-name');

        function escapeHtml(unsafe) {
            return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Apply Inline Formatting (Math, Bold, Italic, Code)
        function formatInline(text) {
            // 1. Math block extraction
            text = text.replace(/\$([^\$]+)\$/g, (match, p1) => {
                let math = p1
                    .replace(/\\rightarrow/g, '→')
                    .replace(/\\leftarrow/g, '←')
                    .replace(/\\le/g, '≤')
                    .replace(/\\ge/g, '≥')
                    .replace(/\\sqrt{([^}]+)}/g, '√($1)')
                    .replace(/\\pmod{([^}]+)}/g, '(mod $1)')
                    .replace(/\\times/g, '×')
                    .replace(/\\div/g, '÷')
                    .replace(/\\neq/g, '≠')
                    .replace(/\\pi/g, 'π');
                return `<span class="math-inline">${math}</span>`;
            });

            // 2. Standard Markdown
            text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>'); // Bold
            text = text.replace(/\*([^\*]+)\*/g, '<em>$1</em>'); // Italic (Non-greedy, avoids bullet collisions)
            text = text.replace(/`([^`]+)`/g, '<code class="inline-code">$1</code>'); // Inline Code
            
            return text;
        }

        // Table Builder Helper
        function buildTable(lines) {
            let tHtml = `<div class="table-wrapper"><table>`;
            let hasHeader = lines.length > 1 && lines[1].replace(/[\s\|\-:]/g, '') === '';
            
            lines.forEach((line, index) => {
                if (index === 1 && hasHeader) return; // Skip separator line
                
                let cells = line.replace(/^\||\|$/g, '').split('|').map(c => c.trim());
                let cellTag = (index === 0 && hasHeader) ? 'th' : 'td';
                
                if (index === 0 && hasHeader) tHtml += `<thead><tr>`;
                else if (index === 0 && !hasHeader) tHtml += `<tbody><tr>`;
                else if (index === 2 && hasHeader) tHtml += `<tbody><tr>`;
                else tHtml += `<tr>`;
                
                cells.forEach(c => {
                    tHtml += `<${cellTag}>${formatInline(escapeHtml(c))}</${cellTag}>`;
                });
                
                tHtml += `</tr>`;
                if (index === 0 && hasHeader) tHtml += `</thead>`;
            });
            
            tHtml += `</tbody></table></div>`;
            return tHtml;
        }

        // Advanced Offline Markdown Parser (Typography Fixes Applied)
        function renderMarkdown(md) {
            let html = "";
            let inCodeBlock = false;
            let codeContent = "";
            let codeLang = "";
            let tableBuffer = [];

            const lines = md.split('\n');
            
            for (let i = 0; i < lines.length; i++) {
                let line = lines[i];
                let trimmed = line.trim();

                // 1. Code Blocks
                if (trimmed.startsWith('```')) {
                    if (inCodeBlock) {
                        html += `<div class="code-block">
                                   <div class="code-header">
                                     <span>${codeLang || 'code'}</span>
                                     <button class="copy-btn" onclick="navigator.clipboard.writeText(this.parentElement.nextElementSibling.innerText); this.innerText='Copied!'; setTimeout(()=>this.innerText='Copy',2000)">Copy</button>
                                   </div>
                                   <pre><code>${escapeHtml(codeContent.trimEnd())}</code></pre>
                                 </div>`;
                        inCodeBlock = false;
                        codeContent = "";
                        codeLang = "";
                    } else {
                        inCodeBlock = true;
                        codeLang = trimmed.replace(/```/g, '');
                    }
                    continue;
                }

                if (inCodeBlock) {
                    codeContent += line + '\n';
                    continue;
                }

                // 2. Table Buffering
                if (trimmed.startsWith('|')) {
                    tableBuffer.push(trimmed);
                    continue;
                } else if (tableBuffer.length > 0) {
                    html += buildTable(tableBuffer);
                    tableBuffer = [];
                }

                // 3. Typography & Blocks
                line = escapeHtml(line);
                line = formatInline(line);
                trimmed = line.trim();
                
                // Horizontal Rules (--- or ***)
                if (trimmed.match(/^(\-\-\-|\*\*\*|___)$/)) {
                    html += `<hr>`;
                }
                // Headers (H1 to H6)
                else if (trimmed.match(/^#{1,6}\s/)) {
                    let level = trimmed.match(/^(#+)/)[1].length;
                    let text = trimmed.replace(/^#+\s/, '');
                    html += `<h${level}>${text}</h${level}>`;
                }
                // Unordered Lists
                else if (trimmed.match(/^[\-\*]\s+/)) {
                    let text = trimmed.replace(/^[\-\*]\s+/, '');
                    html += `<div class="list-item"><span class="list-bullet">&bull;</span><span>${text}</span></div>`;
                }
                // Ordered Lists
                else if (trimmed.match(/^(\d+)\.\s+/)) {
                    let match = trimmed.match(/^(\d+)\.\s+/);
                    let num = match[1];
                    let text = trimmed.substring(match[0].length);
                    html += `<div class="list-item"><span class="list-bullet">${num}.</span><span>${text}</span></div>`;
                }
                // Blank Lines (Restores paragraph spacing)
                else if (trimmed === '') {
                    html += `<br>`;
                }
                // Standard Lines
                else {
                    html += line + '<br>';
                }
            }

            // Flush remaining buffers at the end of the stream
            if (tableBuffer.length > 0) html += buildTable(tableBuffer);
            if (inCodeBlock) {
                 html += `<div class="code-block">
                           <div class="code-header"><span>${codeLang || 'code'}</span></div>
                           <pre><code>${escapeHtml(codeContent.trimEnd())}</code></pre>
                         </div>`;
            }

            return html;
        }

        // Check Server and Load Models
        async function checkStatus() {
            try {
                statusInd.textContent = "Checking...";
                statusInd.className = "";
                
                const response = await fetch(`${OLLAMA_URL}/api/tags`);
                if (!response.ok) throw new Error("Network response was not ok");
                
                const data = await response.json();
                
                statusInd.textContent = "🟢 Active";
                statusInd.className = "status-online";
                
                modelSelect.innerHTML = "";
                if (data.models.length === 0) {
                    modelSelect.innerHTML = "<option value=''>No models found. Run 'ollama run modelname'</option>";
                } else {
                    data.models.forEach(m => {
                        const opt = document.createElement('option');
                        opt.value = m.name;
                        opt.textContent = m.name;
                        modelSelect.appendChild(opt);
                    });
                }
            } catch (error) {
                console.error(error);
                statusInd.textContent = "🔴 Offline (Enable CORS & Serve)";
                statusInd.className = "status-offline";
                modelSelect.innerHTML = "<option value=''>Cannot connect...</option>";
            }
        }

        // Handle File Attachment
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(evt) {
                attachedFileContent = evt.target.result;
                fileNameSpan.textContent = file.name;
                attachmentChip.style.display = "inline-block";
            };
            reader.readAsText(file);
        });

        function clearFile() {
            attachedFileContent = "";
            fileInput.value = "";
            attachmentChip.style.display = "none";
        }

        promptInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function appendMessage(role, text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            msgDiv.innerHTML = `
                <div class="avatar">${role === 'user' ? '👤' : '🤖'}</div>
                <div class="content"></div>
            `;
            if (role === 'user') msgDiv.querySelector('.content').textContent = text;
            chatBox.appendChild(msgDiv);
            window.scrollTo(0, document.body.scrollHeight);
            return msgDiv.querySelector('.content');
        }

        async function sendMessage() {
            let text = promptInput.value.trim();
            const selectedModel = modelSelect.value;
            
            if (!text && !attachedFileContent) return;
            if (!selectedModel) {
                alert("Please ensure Ollama is active and a model is selected.");
                return;
            }

            if (attachedFileContent) {
                text = `Attached Document Content:\n\`\`\`\n${attachedFileContent}\n\`\`\`\n\n${text}`;
                clearFile();
            }

            chatHistory.push({ role: "user", content: text });
            appendMessage('user', text);
            promptInput.value = "";
            
            const contentNode = appendMessage('assistant', '');
            sendBtn.disabled = true;
            abortController = new AbortController();

            try {
                const response = await fetch(`${OLLAMA_URL}/api/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    signal: abortController.signal,
                    body: JSON.stringify({ model: selectedModel, messages: chatHistory, stream: true })
                });

                if (!response.ok) throw new Error("API Error");

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                
                let rawBotMessage = ""; 
                contentNode.innerHTML = ""; 

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n').filter(line => line.trim() !== "");
                    
                    for (const line of lines) {
                        const json = JSON.parse(line);
                        if (json.message && json.message.content) {
                            rawBotMessage += json.message.content;
                            contentNode.innerHTML = renderMarkdown(rawBotMessage);
                            window.scrollTo(0, document.body.scrollHeight);
                        }
                    }
                }
                
                chatHistory.push({ role: "assistant", content: rawBotMessage });

            } catch (error) {
                if(error.name === 'AbortError') {
                    contentNode.innerHTML += "<br><em>[Generation stopped by user]</em>";
                } else {
                    contentNode.textContent = "Error connecting to Ollama. Check terminal.";
                    console.error(error);
                }
            } finally {
                sendBtn.disabled = false;
            }
        }

        checkStatus();
    </script>
</body>
</html>
